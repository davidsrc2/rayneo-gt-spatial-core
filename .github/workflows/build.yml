name: build

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*"]  # a release: the installer goes to GitHub Releases (the app's updates)
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    name: core/hal isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check_core_isolation.sh

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # gh release create on tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Clang, arm64)
            os: macos-latest
            generator: -G Ninja
          - name: Windows (MSVC)
            os: windows-latest
            generator: ""
          - name: Linux (GCC)
            os: ubuntu-latest
            generator: -G Ninja
            cc: gcc
            cxx: g++
          - name: Linux (Clang)
            os: ubuntu-latest
            generator: -G Ninja
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libhidapi-dev libudev-dev

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Core must stay OS-agnostic at link level too: no framework / Win32 symbols.
      - name: Core link isolation (macOS)
        if: runner.os == 'macOS'
        run: |
          if nm -u build/librayneo_core.a | grep -E '_(IO[A-Z]|CF[A-Z]|NS[A-Z]|objc_|MTL|dispatch_)'; then
            echo "core references Apple framework symbols"; exit 1
          fi
          file build/imu_probe | grep arm64
          test -d build/Nimbo.app || echo "Nimbo.app not built on this branch"

      - name: Windows app (WinUI 3)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          $versionArg = if ($v) { "-p:Version=$v" } else { "-p:NimboNoVersion=1" }
          dotnet publish apps/NimboApp/NimboApp.csproj -c Release -o build/NimboApp `
            -p:NimboNativeDir="$PWD/build/Release/" $versionArg
          if (-not (Test-Path build/NimboApp/Nimbo.exe)) { throw "Nimbo.exe missing" }
          if (-not (Test-Path build/NimboApp/nimbo_server.dll)) { throw "nimbo_server.dll not copied next to the app" }
          if (-not (Test-Path build/NimboApp/nimbo_win.exe)) { throw "nimbo_win.exe not copied next to the app" }
          if (-not (Test-Path build/NimboApp/onnxruntime.dll)) { throw "onnxruntime.dll not copied next to the app" }
          if (-not (Test-Path build/NimboApp/DirectML.dll)) { throw "DirectML.dll not copied next to the app" }

      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          ./scripts/windows/make_installer.ps1 -AppDir build/NimboApp -OutDir build/installer -Version $v

      - name: GitHub release (tags)
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The macOS job adds its zip to the same release: whichever comes first creates it.
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "$env:GITHUB_REF_NAME" --title "Nimbo $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes }
          gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem build/installer/Nimbo-Setup-*.exe).FullName --clobber

      - name: macOS release app (tags)
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          if [ -z "${MAC_SIGNING_P12:-}" ]; then
            echo "::warning::MAC_SIGNING_P12 not set (scripts/make_release_signing.sh): no macOS app in this release"
            exit 0
          fi
          kc="$RUNNER_TEMP/nimbo.keychain-db"
          security create-keychain -p ci "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$MAC_SIGNING_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DRAYNEO_VERSION="$v" \
                -DRAYNEO_CODESIGN_IDENTITY="Nimbo Signing" -DRAYNEO_BUILD_TESTS=OFF
          cmake --build build-release --target nimbo --parallel
          codesign --verify --strict build-release/Nimbo.app
          zip="build-release/Nimbo-macOS-$v.zip"
          ditto -c -k --keepParent build-release/Nimbo.app "$zip"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Nimbo $v" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "$zip" --clobber

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nimbo-setup-win-x64
          path: build/installer/Nimbo-Setup-*.exe

      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nimbo-app-win-x64
          path: build/NimboApp

      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nimbo-win-x64
          path: |
            build/Release/nimbo_win.exe
            build/Release/nimbo_server.dll
            build/Release/onnxruntime.dll
            build/Release/DirectML.dll
            build/Release/imu_probe.exe

      - name: Core-only build (no hidapi)
        run: |
          cmake -S . -B build-core ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release -DRAYNEO_BUILD_HAL=OFF
          cmake --build build-core --config Release --parallel
          ctest --test-dir build-core -C Release --output-on-failure
